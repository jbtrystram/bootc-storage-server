name: "Build and push container"
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    - cron:  '0 0 * * MON'
  # allow manual trigger
  workflow_dispatch:

# Prevent multiple workflow runs from racing
concurrency: ${{ github.workflow }}

env:
  REGISTRY_USER: ${{ secrets.QUAY_USER }}
  IMAGE_REGISTRY: 'quay.io'
  REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
  REGISTRY_ORG: "jbtrystram"
  IMAGE_NAME: "storageserver"
  TAG: "latest"
  CONTEXT: "container"


jobs:
  build-and-publish-image:
    name: Build image
    runs-on: ubuntu-24.04
    # Map a step output to a job output
    outputs:
      image_digest: ${{ steps.push-to-quay.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build toolbox image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034
        with:
          image: "${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}"
          context: ${{ env.CONTEXT }}
          tags: ${{ env.TAG }}
          platforms: linux/amd64
          oci: true
          containerfiles: |
            ${{ env.CONTEXT }}/Containerfile

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Push to quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37
        with:
          tags: ${{ steps.build-image.outputs.image }}:${{ env.TAG }}

  sign-image:
    name: Sign image
    runs-on: ubuntu-24.04
    needs: [build-and-publish-image]
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    env:
      DIGEST: ${{ needs.build-and-publish-image.outputs.image_digest }}

    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Sign the images with GitHub OIDC Token
        env:
          IMAGE: "${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}"
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign \
          -a "repo=${{ github.repository }}" \
          -a "workflow=${{ github.workflow }}" \
          -a "ref=${{ github.sha }}" \
          --yes ${IMAGE}@${DIGEST}

  update-readme:
    name: Update README with build date
    runs-on: ubuntu-24.04
    needs: [sign-image]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Update build date in README
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|Last good build:.*|Last good build: ${BUILD_DATE}|" ${{ env.CONTEXT }}/README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CONTEXT }}/README.md
          git commit -m "toolbox: update README with last build date"
          git push
