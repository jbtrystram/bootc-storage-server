cache.files=off
# existing path, most free space: if a path already exists on a branch,
# new content under it stays on that disk.
# Brand new top-level paths still go to whichever branch
# has the most free space, since the pool root exists on every branch.
# See https://trapexit.github.io/mergerfs/latest/config/functions_categories_policies/#policy-descriptions
category.create=epmfs
func.getattr=newest
dropcacheonclose=false
# refuse to write to a branch that have less than 100G free
minfreespace=100G
# nice output in `df -h`
fsname=mergerfs.tank
