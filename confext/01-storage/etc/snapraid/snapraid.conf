# A larger disk holds the parity data
parity /mnt/disks/16tb/tank/snapraid.parity

# file that holds a list of all files and checksums
content /mnt/disks/16tb/tank/snapraid.content
# Also hold a copy on the boot disk for redundancy
content /var/snapraid/snapraid.content
# TODO: a third copy on a disk that isn't part of the array, for extra redundancy
# content /mnt/disks/4tb-1/tank/snapraid.content

# Only the 8tb disk's `safe` subvolume is protected by parity.
# The `tank` subvolumes (on 8tb and other disks) are pooled in
# mergerfs but not covered by snapraid.
data 8tb /mnt/disks/8tb/safe
