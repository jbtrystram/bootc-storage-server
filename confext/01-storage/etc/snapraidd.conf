# Documentation at
# https://github.com/amadvance/snapraid-daemon/blob/master/snapraidd.conf.example

# Run every night at 2 AM.
maintenance_schedule = 02:00

# 3 months of logs
sys_log_retention_days = 120

# enable the HTTP interface
net_enabled = 1

# Mgmt VLAN only
net_port = 192.168.250.22:7627

# Security options for the WebUI
net_security_headers = 1
net_allowed_origin = self
net_config_full_access = 0

# Theme for the WebUI
net_web_root = commander.zip

# Let's have the WebUI nag us about updates
check_updates = 1

# number of deleted or missing files that will trigger a 'sync'
# operation abort to prevent accidental parity loss.
sync_threshold_deletes = 50

# number of modified or updated files that will trigger a 'sync'
# operation abort. Only enforced during scheduled operations.
sync_threshold_updates = 100

# how much of the array is verified after a sync
scrub_percentage = 0.7

# Do not scrub blocks newer than the specified number of days.
scrub_older_than = 10

# For filesystems that don't support sub-second precision
# timestamps
touch_zero_subseconds = 1

# how often the daemon checks
# SMART attributes, provided the disks are already spinning
probe_interval_minutes = 3

# automatically spin down data and
# parity disks after the specified period of inactivity.
spindown_idle_minutes = 15

# Forward daemon activity to the system journal
notify_syslog_enabled = 1
notify_syslog_level = info

notify_result_level = warning

# log a detailed list of file changes discovered
# before the sync begins.
notify_differences = 1
