cache.files=off
# most shared path, most free space
# i.e. it will first look for a branch that already have the path
# and if not, go with most free space.
category.create=mspmfs
func.getattr=newest
dropcacheonclose=false
# refuse to write to a branch that have less than 100G free
minfreespace=100G
# nice output in `df -h`
fsname=mergerfs.safe
